name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: semantic
        uses: cycjimmy/semantic-release-action@v8.1.4
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Start image publish
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.semantic.outputs.new_release_version }}
        run: gh workflow run docker-publish.yml --ref "$TAG"
